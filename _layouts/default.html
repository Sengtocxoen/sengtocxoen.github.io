<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · Blog{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <meta name="author" content="{{ site.author }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 200 }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent:#0ea5e9; --accent2:#6366f1; --dark:#0f172a; --mid:#1e293b;
      --border:#334155; --muted:#64748b; --light:#94a3b8; --text:#e2e8f0; --white:#f8fafc;
      --ok:#34d399; --bad:#f87171; --warn:#fbbf24;
    }
    html { font-size: 16px; scroll-behavior: smooth; }
    body { font-family:'Inter',sans-serif; background:var(--dark); color:var(--text); line-height:1.7; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

    /* top bar */
    .site-nav { border-bottom:1px solid var(--border); background:rgba(15,23,42,.85);
      backdrop-filter:blur(8px); position:sticky; top:0; z-index:50; }
    .site-nav .wrap { display:flex; align-items:center; justify-content:space-between; height:60px; }
    .site-nav .brand { font-weight:700; color:var(--white); font-size:1.02rem; }
    .site-nav .brand span { color:var(--accent); }
    .site-nav .links a { color:var(--light); font-size:.9rem; margin-left:22px; font-weight:500; }
    .site-nav .links a:hover { color:var(--white); text-decoration:none; }

    /* footer */
    footer { border-top:1px solid var(--border); margin-top:64px; padding:28px 0;
      color:var(--muted); font-size:.85rem; }
    footer .wrap { display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; }

    /* blog index */
    .blog-head { padding: 52px 0 8px; }
    .blog-head h1 { font-size:2rem; color:var(--white); letter-spacing:-.02em; }
    .blog-head p { color:var(--light); margin-top:8px; }
    .post-list { list-style:none; margin-top:28px; }
    .post-list li { padding:22px 0; border-bottom:1px solid var(--border); }
    .post-list a.post-title { color:var(--white); font-size:1.22rem; font-weight:600; letter-spacing:-.01em; }
    .post-list a.post-title:hover { color:var(--accent); text-decoration:none; }
    .post-meta { color:var(--muted); font-size:.8rem; font-family:'Fira Code',monospace; margin-top:6px; }
    .post-list p.excerpt { color:var(--light); margin-top:10px; font-size:.95rem; }
    .tag { display:inline-block; font-family:'Fira Code',monospace; font-size:.68rem; color:var(--accent);
      border:1px solid var(--border); border-radius:5px; padding:2px 8px; margin-right:6px; }

    /* post */
    article.post { padding-top: 44px; }
    article.post .post-title { font-size:2.1rem; line-height:1.2; color:var(--white); letter-spacing:-.025em; }
    article.post .post-sub { color:var(--light); font-size:1.05rem; margin-top:12px; }
    article.post .post-meta { margin:16px 0 8px; }
    .post-content { margin-top:28px; font-size:1.02rem; }
    .post-content h2 { color:var(--white); font-size:1.5rem; margin:40px 0 14px; letter-spacing:-.01em;
      padding-bottom:8px; border-bottom:1px solid var(--border); }
    .post-content h3 { color:var(--white); font-size:1.18rem; margin:30px 0 10px; }
    .post-content p { margin:14px 0; }
    .post-content ul, .post-content ol { margin:14px 0 14px 26px; }
    .post-content li { margin:6px 0; }
    .post-content strong { color:var(--white); }
    .post-content blockquote { border-left:3px solid var(--accent); background:var(--mid);
      padding:12px 18px; margin:18px 0; color:var(--light); border-radius:0 8px 8px 0; }
    .post-content img { border-radius:10px; border:1px solid var(--border); }
    hr { border:none; border-top:1px solid var(--border); margin:34px 0; }

    /* code */
    code { font-family:'Fira Code',monospace; font-size:.86em; background:var(--mid);
      border:1px solid var(--border); border-radius:5px; padding:1px 6px; color:#e5edff; }
    pre { background:#0b1220; border:1px solid var(--border); border-radius:10px;
      padding:16px 18px; overflow-x:auto; margin:18px 0; }
    pre code { background:none; border:none; padding:0; font-size:.85rem; line-height:1.6; color:var(--text); }

    /* terminal window */
    .term { background:#0b1220; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin:20px 0; }
    .term-bar { display:flex; align-items:center; gap:7px; padding:9px 13px; background:#111a2e; border-bottom:1px solid var(--border); }
    .term-dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
    .term-dot.r{background:#ff5f56;} .term-dot.y{background:#ffbd2e;} .term-dot.g{background:#27c93f;}
    .term-title { color:var(--muted); font-family:'Fira Code',monospace; font-size:.74rem; margin-left:8px; }
    .term pre { background:none; border:none; border-radius:0; margin:0; }
    .term .ok{color:var(--ok);} .term .bad{color:var(--bad);} .term .warn{color:var(--warn);}
    .term .dim{color:var(--muted);} .term .cmd{color:var(--white);} .term .accent{color:var(--accent);}

    .callout { background:var(--mid); border:1px solid var(--border); border-left:3px solid var(--warn);
      border-radius:0 8px 8px 0; padding:14px 18px; margin:20px 0; font-size:.95rem; color:var(--light); }
  </style>
</head>
<body>
  <nav class="site-nav">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">sang<span>.</span>sec</a>
      <div class="links">
        <a href="{{ '/index.html' | relative_url }}">CV</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="https://hackerone.com/sengtocxoen" target="_blank" rel="noopener">HackerOne</a>
        <a href="https://github.com/Sengtocxoen" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </nav>

  <main class="wrap">
    {{ content }}
  </main>

  <footer>
    <div class="wrap">
      <span>© {{ site.time | date: '%Y' }} {{ site.author }}</span>
      <span>Built with Jekyll · <a href="{{ '/index.html' | relative_url }}">CV</a></span>
    </div>
  </footer>
</body>
</html>
