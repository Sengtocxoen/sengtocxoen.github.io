---
layout: default
---
<article class="post">
  <a href="{{ '/blog/' | relative_url }}" style="color:var(--muted);font-size:.85rem;font-family:'Fira Code',monospace;">← all posts</a>
  <h1 class="post-title">{{ page.title }}</h1>
  {% if page.subtitle %}<p class="post-sub">{{ page.subtitle }}</p>{% endif %}
  <div class="post-meta">
    {{ page.date | date: "%B %-d, %Y" }}{% if page.read_time %} · {{ page.read_time }}{% endif %}
    {% if page.tags %}<br>{% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}{% endif %}
  </div>
  <div class="post-content">
    {{ content }}
  </div>
</article>
